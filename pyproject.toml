[build-system]
requires = ["pbr>=6.1.1"]
build-backend = "pbr.build"

[project]
name = "oslo.vmware"
description = "Oslo VMware library"
authors = [
    {name = "OpenStack", email = "openstack-discuss@lists.openstack.org"},
]
readme = {file = "README.rst", content-type = "text/x-rst"}
license = "Apache-2.0"
dynamic = ["version", "dependencies"]
requires-python = ">=3.11"
classifiers = [
    "Environment :: OpenStack",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]

[project.urls]
Homepage = "https://docs.openstack.org/oslo.vmware"
Repository = "https://opendev.org/openstack/oslo.vmware"

[tool.setuptools.packages.find]
include = ["oslo_vmware*"]

[tool.ruff]
line-length = 79

[tool.ruff.format]
quote-style = "preserve"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "G", "LOG", "S", "UP"]
external = ["H"]
ignore = [
    "S101",  # asserts are only used for type narrowing
    "UP031",  # TODO(tkajinam): Remove this
]

[tool.ruff.lint.per-file-ignores]
"oslo_vmware/tests/*" = ["S"]
