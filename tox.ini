[tox]
minversion = 4.28.0
envlist = py3,pep8

[testenv]
setenv =
  PYTHONDONTWRITEBYTECODE=1
constraints =
  {env:TOX_CONSTRAINTS_FILE:https://releases.openstack.org/constraints/upper/master}
deps =
  -r{toxinidir}/test-requirements.txt
commands = stestr run --slowest {posargs}

[testenv:pep8]
skip_install = true
deps =
  pre-commit
commands =
  pre-commit run -a

[testenv:docs]
allowlist_externals =
  rm
deps =
  {[testenv]deps}
  -r{toxinidir}/doc/requirements.txt
commands =
  rm -rf doc/build doc/source/reference/api
  sphinx-build -W --keep-going -b html doc/source doc/build/html

[testenv:cover]
setenv =
  PYTHON=coverage run --source oslo_vmware --parallel-mode
deps =
  {[testenv]deps}
  coverage>=5.0 # Apache-2.0
commands =
  coverage erase
  {[testenv]commands}
  coverage combine
  coverage html -d cover
  coverage xml -o cover/coverage.xml
  coverage report

[testenv:venv]
commands = {posargs}

[flake8]
show-source = True
# We only enable the hacking (H) checks
select = H
# H405: multi line docstring summary not separated with an empty line
ignore = H405
exclude=.venv,.git,.tox,dist,doc,*lib/python*,*egg,build,__init__.py

[hacking]
import_exceptions =
  oslo_vmware.tests.base
  tests.base

[flake8:local-plugins]
extension =
  N537 = checks:no_translate_logs
paths = ./oslo_vmware/hacking

[testenv:releasenotes]
skip_install = true
allowlist_externals = rm
deps =
  -r{toxinidir}/doc/requirements.txt
commands =
  rm -rf releasenotes/build
  sphinx-build -a -E -W -d releasenotes/build/doctrees --keep-going -b html releasenotes/source releasenotes/build/html

[testenv:bindep]
skip_install = true
# Do not install any requirements. We want this to be fast and work even if
# system dependencies are missing, since it's used to tell you what system
# dependencies are missing! This also means that bindep must be installed
# separately, outside of the requirements files, and develop mode disabled
# explicitly to avoid unnecessarily installing the checked-out repo too.
deps = bindep
commands = bindep test
